<main>

<!-- HERO -->
<section class="hero" id="home"><div class="wrap">
  <div>
    <p class="pill" data-i18n="hero.badge"></p>
    <p class="hello" data-i18n="hero.hello">HALO, SAYA</p>
    <h1>Muhammad Rafi Aditya Putra</h1>
    <p class="role" data-i18n="hero.role">Frontend Developer &amp; Calon Software Engineer</p>
    <p class="sub" data-i18n="hero.sub1"></p>
    <p class="sub" data-i18n="hero.sub2"></p>
    <div class="cta">
      <a class="btn primary" href="#projects" data-i18n="hero.explore">Lihat Proyek Saya</a>
      <a class="btn" href="public/resume.pdf" download="Resume-Muhammad-Rafi-Aditya-Putra.pdf" data-i18n="hero.resume">Unduh Resume</a>
    </div>
    <div class="social" id="social"></div>
  </div>
  <div class="photo"><img src="public/images/profile.jpg" data-i18n-attr="alt:hero.photoAlt" alt="" width="320" height="400" fetchpriority="high"></div>
</div></section>

<!-- ABOUT -->
<section id="about"><div class="wrap rv">
  <p class="eyebrow" data-i18n="eyebrow.about"></p>
  <h2 data-i18n="about.title"></h2>
  <div class="about" style="margin-top:36px">
    <div>
      <p data-i18n="about.p1"></p>
      <p data-i18n="about.p2"></p>
      <p data-i18n="about.p3"></p>
    </div>
    <dl class="facts">
      <div><dt data-i18n="about.focusL"></dt><dd data-i18n="about.focusV"></dd></div>
      <div><dt data-i18n="about.eduL"></dt><dd data-i18n="about.eduV"></dd></div>
      <div><dt data-i18n="about.learnL"></dt><dd data-i18n="about.learnV"></dd></div>
      <div><dt data-i18n="about.goalL"></dt><dd data-i18n="about.goalV"></dd></div>
    </dl>
  </div>
</div></section>

<!-- SKILLS -->
<section id="skills"><div class="wrap rv">
  <p class="eyebrow" data-i18n="eyebrow.skills"></p>
  <h2 data-i18n="skills.title"></h2>
  <p class="lead" data-i18n="skills.lead"></p>
  <h3 class="sub-h" data-i18n="skills.using"></h3><div class="grid" id="using"></div>
  <h3 class="sub-h" data-i18n="skills.learning"></h3><div class="grid" id="learning"></div>
</div></section>

<!-- PROJECTS -->
<section id="projects"><div class="wrap rv">
  <p class="eyebrow" data-i18n="eyebrow.projects"></p>
  <h2 data-i18n="projects.title"></h2>
  <p class="lead" data-i18n="projects.lead"></p>
  <div class="filters" id="filters" role="group" data-i18n-attr="aria-label:projects.filterLabel"></div>
  <div class="cards" id="cards" aria-live="polite"></div>
</div></section>

<!-- JOURNEY & EDUCATION -->
<section id="journey"><div class="wrap rv">
  <p class="eyebrow" data-i18n="eyebrow.journey"></p>
  <h2 data-i18n="journey.title"></h2>
  <ol class="tl" id="timeline"></ol>
  <div class="edu">
    <div><h3 data-i18n="edu.title"></h3><p data-i18n="edu.years"></p></div>
    <span class="st" data-i18n="edu.status"></span>
  </div>
</div></section>

<!-- CONTACT -->
<section id="contact"><div class="wrap rv contact">
  <div>
    <p class="eyebrow" data-i18n="eyebrow.contact"></p>
    <h2 data-i18n="contact.title"></h2>
    <p class="lead" data-i18n="contact.lead"></p>
    <div class="clinks" id="clinks"></div>
    <p style="margin-top:28px"><a class="btn primary" id="mailbtn" href="#" data-i18n="contact.email"></a></p>
  </div>
  <form id="form" novalidate>
    <label><span data-i18n="form.name"></span><input name="name" autocomplete="name" required><span class="err" data-for="name"></span></label>
    <label><span data-i18n="form.email"></span><input name="email" type="email" autocomplete="email" required><span class="err" data-for="email"></span></label>
    <label><span data-i18n="form.message"></span><textarea name="message" rows="5" required></textarea><span class="err" data-for="message"></span></label>
    <button class="btn primary" type="submit" data-i18n="form.send"></button>
    <p class="note" id="status" role="status" data-i18n="form.note"></p>
  </form>
</div></section>

</main>

<footer><div class="wrap">
  <div><b>Muhammad Rafi Aditya Putra</b><br><span data-i18n="footer.role"></span></div>
  <div class="social" id="fsocial"></div>
  <div>© <span id="year"></span> · <span data-i18n="footer.tagline"></span></div>
</div></footer>
